<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote of the Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f5132, #20a56b);
      color: #fff;
      font-family: 'Playfair Display', Georgia, serif;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    .pill {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: #ff9f1c;
      color: #1a1a1a;
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }
    blockquote { max-width: 800px; margin: 0; }
    p { font-size: clamp(1.6rem, 4vw, 3rem); font-style: italic; line-height: 1.4; margin: 0 0 1.5rem; }
    footer { font-size: 1.2rem; opacity: 0.8; }
  </style>
</head>
<body>
  <span class="pill">Slot1</span>
  <blockquote>
    <p>“Earth is the cradle of humanity, but one cannot live in a cradle forever.”</p>
    <footer>— Konstantin Tsiolkovsky</footer>
  </blockquote>
</body>
</html>
